global:
  scrape_interval: 15s

storage:
  tsdb:
    retention:
      time: 15d

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'app'
    static_configs:
      - targets: ['app:8080']
    metrics_path: /metrics
    scrape_interval: 30s
